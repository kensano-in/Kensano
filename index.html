<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Kensano Library</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Playfair+Display:wght@500&family=Great+Vibes&display=swap" rel="stylesheet">

<style>

/* ===== LEATHER BACKGROUND ===== */
body{
margin:0;
font-family:"Cormorant Garamond",serif;
color:#e8dcc1;
background:
radial-gradient(circle at 20% 20%,rgba(255,255,255,.04),transparent 30%),
linear-gradient(#14120f,#0b0a08);
overflow-x:hidden;
}

/* ===== RAIN ===== */
canvas{
position:fixed;
top:0;
left:0;
z-index:-1;
}

/* ===== MAIN ===== */
.container{
max-width:800px;
margin:auto;
padding:60px 20px;
text-align:center;
}

.logo{
font-family:"Playfair Display";
font-size:42px;
letter-spacing:8px;
margin-bottom:10px;
}

.subtitle{
opacity:.6;
margin-bottom:40px;
}

/* ===== BOOK ===== */
.book{
perspective:1500px;
margin:auto;
width:100%;
max-width:600px;
height:320px;
position:relative;
}

.page{
position:absolute;
width:100%;
height:100%;
background:#1a1815;
border-radius:10px;
padding:40px;
box-shadow:0 20px 60px rgba(0,0,0,.7);
backface-visibility:hidden;
transition:transform 1s;
}

.page.flip{
transform:rotateY(-180deg);
}

.hand{
font-family:"Great Vibes",cursive;
font-size:28px;
line-height:1.7;
}

/* ===== BUTTON ===== */
button{
margin-top:20px;
padding:10px 20px;
background:none;
border:1px solid #cbb27a;
color:#e8dcc1;
cursor:pointer;
}

button:hover{
background:#cbb27a;
color:black;
}

/* ===== UPCOMING ===== */
.upcoming{
margin-top:50px;
opacity:.8;
}

</style>
</head>
<body>

<canvas id="rain"></canvas>

<div class="container">

<div class="logo">KENSANO</div>
<div class="subtitle">Private Digital Archive</div>

<div class="book">
<div class="page" id="p1">
<div class="hand">
She left before the last sentence…  
The ink still waits.
</div>
</div>

<div class="page" id="p2" style="transform:rotateY(180deg)">
<div class="hand">
Poets stay quiet because storms whisper inside them.
</div>
</div>
</div>

<button onclick="turn()">Turn Page</button>

<div class="upcoming">
Upcoming Manuscripts:<br>
Adhuri Dastaan<br>
Poets Are Quiet<br>
Love & Luck<br>
Last Letter in Winter<br>
Dust of Old Letters
</div>

<button onclick="toggleFire()">🔥 Fireplace Sound</button>

</div>

<script>

/* ===== PAGE TURN ===== */
let flipped=false;
function turn(){
document.getElementById("p1").classList.toggle("flip");
flipped=!flipped;
}

/* ===== FIREPLACE ===== */
let fire=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_5f0cfa8c88.mp3");
fire.loop=true;

function toggleFire(){
if(fire.paused) fire.play();
else fire.pause();
}

/* ===== RAIN EFFECT ===== */
let c=document.getElementById("rain");
let ctx=c.getContext("2d");
c.width=innerWidth;
c.height=innerHeight;

let drops=[];
for(let i=0;i<200;i++)
drops.push({x:Math.random()*c.width,y:Math.random()*c.height});

function draw(){
ctx.fillStyle="rgba(0,0,0,.3)";
ctx.fillRect(0,0,c.width,c.height);

ctx.strokeStyle="rgba(200,200,255,.3)";
ctx.lineWidth=1;

for(let d of drops){
ctx.beginPath();
ctx.moveTo(d.x,d.y);
ctx.lineTo(d.x,d.y+10);
ctx.stroke();

d.y+=10;
if(d.y>c.height) d.y=0;
}

requestAnimationFrame(draw);
}
draw();

</script>
</body>
</html>
