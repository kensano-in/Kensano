<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kensano Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@300;500;700&family=Playfair+Display:wght@500&display=swap" rel="stylesheet">

<style>

:root{
--gold:#d6c39a;
--bg:#0b0c10;
--card:#121318;
}

*{box-sizing:border-box;}

body{
margin:0;
font-family:"Cormorant Garamond",serif;
background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.9)),
url("https://images.unsplash.com/photo-1521587760476-6c12a4b040da?q=80&w=1500");
background-size:cover;
background-attachment:fixed;
color:#eee6d1;
}

/* ===== CENTER LAYOUT ===== */
.wrapper{
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
padding:30px;
}

/* ===== MAIN CARD ===== */
.card{
max-width:680px;
width:100%;
background:rgba(15,16,20,.92);
backdrop-filter:blur(6px);
padding:40px 30px;
border-radius:16px;
box-shadow:0 20px 80px rgba(0,0,0,.8);
text-align:center;
}

/* ===== LOGO ===== */
.logo{
font-family:"Playfair Display";
letter-spacing:10px;
font-size:38px;
margin-bottom:8px;
color:var(--gold);
}

.subtitle{
opacity:.7;
font-size:14px;
margin-bottom:30px;
}

/* ===== QUOTE ===== */
.quote{
font-style:italic;
font-size:20px;
line-height:1.7;
margin-bottom:40px;
opacity:.95;
}

/* ===== UPCOMING ===== */
.section-title{
letter-spacing:3px;
font-size:16px;
margin-top:20px;
margin-bottom:10px;
color:var(--gold);
}

.books{
line-height:1.9;
font-size:18px;
margin-bottom:20px;
}

/* ===== COUNTDOWN ===== */
.countdown{
font-size:18px;
margin-top:15px;
opacity:.8;
}

/* ===== BUTTON ===== */
.btn{
margin-top:25px;
padding:12px 26px;
border:1px solid var(--gold);
background:none;
color:var(--gold);
cursor:pointer;
font-size:16px;
border-radius:6px;
transition:.3s;
}
.btn:hover{
background:var(--gold);
color:black;
}

/* ===== MOBILE ===== */
@media(max-width:500px){
.logo{font-size:28px;}
.quote{font-size:17px;}
.books{font-size:16px;}
.card{padding:30px 20px;}
}

</style>
</head>
<body>

<div class="wrapper">

<div class="card">

<div class="logo">KENSANO</div>
<div class="subtitle">Private Digital Archive</div>

<div class="quote">
“A quiet cathedral of books is awakening…  
ink remembers every love that history forgot.”
</div>

<div class="section-title">Upcoming Manuscripts</div>

<div class="books">
Adhuri Dastaan<br>
Poets Are Quiet<br>
Love & Luck<br>
Last Letter in Winter<br>
Dust of Old Letters<br>
Midnight Without You<br>
The Library of Lost Promisses
</div>

<div class="countdown" id="timer"></div>

<button class="btn" onclick="fire()">🔥 Fireplace Ambience</button>

</div>
</div>

<script>

/* ===== COUNTDOWN ===== */
const launch=new Date();
launch.setDate(launch.getDate()+30);

setInterval(()=>{
let now=new Date();
let diff=launch-now;

let d=Math.floor(diff/86400000);
let h=Math.floor(diff/3600000)%24;
let m=Math.floor(diff/60000)%60;
let s=Math.floor(diff/1000)%60;

document.getElementById("timer").innerHTML=
"Opening in "+d+"d "+h+"h "+m+"m "+s+"s";

},1000);

/* ===== FIREPLACE ===== */
let f=new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_5f0cfa8c88.mp3");
f.loop=true;
function fire(){
if(f.paused)f.play();
else f.pause();
}

</script>

</body>
</html>
