<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KENSANO Archive</title>

<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600&family=Cormorant+Garamond:wght@400;600&family=Great+Vibes&display=swap" rel="stylesheet">

<style>
/* ================= BASE ================= */
body{
margin:0;
background:#040404;
font-family:"Cormorant Garamond",serif;
color:#f1e6c4;
overflow:hidden;
}

/* ================= INTRO ================= */
#intro{
position:fixed;inset:0;
background:black;
display:flex;
align-items:center;
justify-content:center;
font-size:36px;
letter-spacing:10px;
color:#d7c39b;
z-index:9999;
animation:intro 4s forwards;
}
@keyframes intro{
0%,80%{opacity:1}
100%{opacity:0;visibility:hidden}
}

/* ================= RAIN + THUNDER ================= */
.rain{
position:fixed;inset:0;
background:url("https://i.imgur.com/9QvZ6sB.png");
opacity:.12;
animation:rain 0.6s linear infinite;
pointer-events:none;
}
@keyframes rain{
from{background-position:0 0}
to{background-position:-200px 400px}
}

.flash{
position:fixed;inset:0;
background:white;
opacity:0;
pointer-events:none;
}

/* ================= 3D ROOM ================= */
.scene{height:100vh;perspective:1400px;}
.room{
height:100%;
transform-style:preserve-3d;
transition:.15s;
background:
linear-gradient(rgba(0,0,0,.7),rgba(0,0,0,.9)),
url("https://images.unsplash.com/photo-1524995997946-a1c2e315a42f?q=80&w=1600");
background-size:cover;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
}

/* ================= CANDLE SHADOW ================= */
.shadow{
position:fixed;
inset:0;
background:radial-gradient(circle at 50% 40%,rgba(255,180,80,.25),transparent 60%);
pointer-events:none;
animation:flicker 2s infinite alternate;
}
@keyframes flicker{from{opacity:.2}to{opacity:.4}}

/* ================= BOOKS ================= */
.logo{
font-family:"Playfair Display";
letter-spacing:10px;
font-size:40px;
margin-bottom:20px;
color:#d7c39b;
cursor:pointer;
}

.shelf{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(140px,1fr));
gap:14px;
width:90%;
max-width:900px;
}

.book{
background:linear-gradient(#7a4d2c,#1a0f08);
padding:18px;
border-radius:6px;
cursor:pointer;
transition:.25s;
}
.book:hover{
transform:translateY(-6px);
box-shadow:0 0 20px rgba(255,200,120,.5);
}

/* ================= SECRET ROOM ================= */
.secret{
position:fixed;
inset:0;
background:#000;
display:none;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
z-index:999;
font-family:"Great Vibes";
font-size:28px;
}

/* ================= READER ================= */
.reader{
position:fixed;
inset:0;
background:#111;
display:none;
align-items:center;
justify-content:center;
}
.page{
width:90%;
max-width:500px;
height:350px;
background:#efe4c5;
color:#000;
padding:25px;
border-radius:6px;
}

/* ================= DIARY ================= */
.diary{
position:fixed;
inset:0;
background:rgba(0,0,0,.95);
display:none;
flex-direction:column;
align-items:center;
padding:20px;
overflow:auto;
}
textarea{
width:90%;
max-width:400px;
height:120px;
background:#222;
color:#fff;
padding:10px;
border:none;
}
.entry{
margin:10px;
background:#111;
padding:10px;
border-radius:5px;
max-width:400px;
}
button{padding:8px 15px;margin:5px;}
</style>
</head>

<body>

<div id="intro">KENSANO ARCHIVE</div>
<div class="rain"></div>
<div class="flash" id="flash"></div>
<div class="shadow"></div>

<div class="scene">
<div class="room" id="room">

<div class="logo" ondblclick="openDiary()">KENSANO</div>

<div class="shelf">
<div class="book" onclick="openReader('Adhuri Dastaan — Shubh')">Adhuri Dastaan</div>
<div class="book" onclick="openReader('Poets Are Quiet — Kanav')">Poets Are Quiet</div>
<div class="book" onclick="openReader('Love & Luck — Siddharth')">Love & Luck</div>
<div class="book" onclick="openSecret()">📜 Rare Shelf</div>
</div>

</div>
</div>

<!-- SECRET ROOM -->
<div class="secret" id="secret">
Ek kitaab khuli…  
aur tera naam gira…  
jaise khamoshi me sitara toot gaya.  
<br><br>— Shubh
<button onclick="secret.style.display='none'">Close</button>
</div>

<!-- READER -->
<div class="reader" id="reader">
<div class="page" id="page">
Swipe → Next Page<br><br>
She left before the last line… ink remembers.
</div>
<button onclick="reader.style.display='none'">Close</button>
</div>

<!-- DIARY -->
<div class="diary" id="diary">
<h2>Secret Shayari Diary</h2>
<textarea id="shayari"></textarea>
<br>
<button onclick="add()">Add</button>
<button onclick="diary.style.display='none'">Close</button>
<div id="list"></div>
</div>

<audio id="flip" src="https://cdn.pixabay.com/download/audio/2022/03/15/audio_9b5c1c61e0.mp3"></audio>
<audio id="thunder" src="https://cdn.pixabay.com/download/audio/2021/09/06/audio_91f31d6d3e.mp3"></audio>

<script>
/* WALK INSIDE */
let x=0,y=0;
document.addEventListener("mousemove",e=>{
x=(e.clientX/window.innerWidth-0.5)*25;
y=(e.clientY/window.innerHeight-0.5)*10;
room.style.transform=`rotateY(${x}deg) rotateX(${-y}deg)`;
});

/* THUNDER */
setInterval(()=>{
if(Math.random()<.3){
flash.style.opacity=.8;
thunder.play();
setTimeout(()=>flash.style.opacity=0,200);
}
},6000);

/* SECRET ROOM */
function openSecret(){secret.style.display="flex";}

/* READER */
let startX=0;
function openReader(name){
reader.style.display="flex";
page.innerHTML=name+"<br><br>Some stories never end…";
flip.play();
}
page.addEventListener("touchstart",e=>startX=e.touches[0].clientX);
page.addEventListener("touchend",e=>{
if(Math.abs(e.changedTouches[0].clientX-startX)>50){
page.innerHTML="Next Page<br><br>Love lives between lines.";
}
});

/* DIARY */
function openDiary(){
diary.style.display="flex";
load();
}
function add(){
let t=shayari.value.trim();
if(!t)return;
let d=JSON.parse(localStorage.getItem("kensano")||"[]");
d.push(t);
localStorage.setItem("kensano",JSON.stringify(d));
shayari.value="";
load();
}
function load(){
let d=JSON.parse(localStorage.getItem("kensano")||"[]");
list.innerHTML="";
d.forEach(x=>{
let e=document.createElement("div");
e.className="entry";
e.innerText=x;
list.appendChild(e);
});
}
</script>

</body>
</html>
