<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kensano Private Library</title>

<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Crimson+Text&display=swap" rel="stylesheet">

<style>
body{
margin:0;
background:#0a0a0c;
color:#e8dfc9;
font-family:"Crimson Text",serif;
}

/* INTRO */
#intro{
position:fixed;
inset:0;
background:black;
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
z-index:10;
animation:fade 5s forwards 5s;
}
#intro h1{
font-family:"Cinzel";
letter-spacing:12px;
font-size:60px;
background:linear-gradient(90deg,#fff,#d6c39a,#fff);
-webkit-background-clip:text;
color:transparent;
}
#intro p{opacity:.6}
@keyframes fade{to{opacity:0;visibility:hidden}}

/* CARD */
.wrap{
max-width:800px;
margin:100px auto;
padding:50px;
background:#121318;
border-radius:22px;
box-shadow:0 40px 100px rgba(0,0,0,.8);
text-align:center;
}

.logo{
font-family:"Cinzel";
font-size:48px;
letter-spacing:10px;
margin-bottom:10px;
background:linear-gradient(90deg,#fff,#d6c39a,#fff);
-webkit-background-clip:text;
color:transparent;
}

.subtitle{
opacity:.7;
margin-bottom:30px;
font-size:18px;
}

/* BOOK */
.book{
width:220px;
height:150px;
margin:30px auto;
background:#d9c9a3;
position:relative;
transform-style:preserve-3d;
animation:flip 5s infinite alternate ease-in-out;
}
@keyframes flip{
from{transform:rotateY(-15deg)}
to{transform:rotateY(15deg)}
}

/* PARCHMENT */
.paper{
background:#f5e7c6;
color:#000;
padding:25px;
border-radius:12px;
margin:30px 0;
font-style:italic;
}

/* BUTTON */
button{
padding:12px 20px;
border:none;
border-radius:12px;
background:linear-gradient(90deg,#e7d9b7,#bfa979);
font-weight:bold;
cursor:pointer;
margin:10px;
}

.footer{
margin-top:30px;
opacity:.6;
}
</style>
</head>

<body>

<div id="intro">
<h1>KENSANO</h1>
<p>A Private Digital Library</p>
</div>

<div class="wrap">

<div class="logo">KENSANO</div>
<div class="subtitle">
A quiet cathedral of books is awakening…<br>
where unfinished poems wait for candlelight.
</div>

<div class="book"></div>

<div class="paper" id="quote"></div>

<button onclick="letter()">Founder Letter</button>

<p>
Upcoming Manuscript: <b>Adhuri Dastaan</b><br>
Submit your story → <b>admin@kensano.in</b>
</p>

<div class="footer" id="motto"></div>

</div>

<script>

/* QUOTE */
const quotes=[
"Some books are doors, some are mirrors.",
"A poem is a wound that learns to sing.",
"The quietest libraries hold the loudest hearts.",
"In candlelight, even silence reads."
];
quote.innerText=quotes[Math.floor(Math.random()*quotes.length)];

/* MOTTO */
const mottos=[
"Ex Libris Lux",
"Veritas Libris Habitat",
"Silentium Sapientiae Custos",
"Scientia in Tenebris Lucet"
];
motto.innerText="Latin Motto — "+mottos[Math.floor(Math.random()*mottos.length)];

function letter(){
alert("My dear reader…\\nKensano is not built with code alone, but with patience, heartbreak, and unfinished poems.\\n— Shinichiro & Ken");
}

</script>
</body>
</html>
