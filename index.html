<!DOCTYPE html><html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kensano Phase‑11 Library</title>
<style>
body{margin:0;overflow:hidden;background:#05060a;font-family:serif}
#hud{position:fixed;top:10px;left:10px;color:#e7d9b7;background:rgba(0,0,0,.5);padding:10px;border-radius:10px;font-size:13px}
button{margin-top:6px;padding:6px 10px}
</style>
</head>
<body>
<div id="hud">
<b>KENSANO LIBRARY</b><br>
WASD move • Mouse look<br>
<button onclick="playPiano()">🎹 Piano</button>
<button onclick="toggleFire()">🔥 Fireplace</button>
</div>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.160.0/examples/js/controls/PointerLockControls.js"></script>
<script>
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x05060a);const camera=new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,1000); camera.position.set(0,2,6);

const renderer=new THREE.WebGLRenderer({antialias:true}); renderer.setSize(innerWidth,innerHeight); document.body.appendChild(renderer.domElement);

/* LIGHTS */ const candle=new THREE.PointLight(0xffd89c,2,30); candle.position.set(0,5,0); scene.add(candle); scene.add(new THREE.AmbientLight(0x404040));

/* FLOOR */ const floor=new THREE.Mesh(new THREE.PlaneGeometry(60,60),new THREE.MeshStandardMaterial({color:0x222222})); floor.rotation.x=-Math.PI/2;scene.add(floor);

/* TEXTURED SHELF */ const texture=new THREE.TextureLoader().load('https://i.imgur.com/5v5XGzF.jpeg'); for(let i=-10;i<=10;i+=5){ const shelf=new THREE.Mesh(new THREE.BoxGeometry(1,5,10),new THREE.MeshStandardMaterial({map:texture})); shelf.position.set(i,2.5,-5); scene.add(shelf); }

/* FIREPLACE */ let fireOn=false; const fireLight=new THREE.PointLight(0xff5500,2,20); fireLight.position.set(0,1,-8); scene.add(fireLight); function toggleFire(){fireOn=!fireOn;fireLight.intensity=fireOn?2:0}

/* SECRET ROOM */ const door=new THREE.Mesh(new THREE.BoxGeometry(3,6,.5),new THREE.MeshStandardMaterial({color:0x222222})); door.position.set(0,3,-10); scene.add(door); window.addEventListener('keydown',e=>{ if(e.key==='e'){door.position.z-=5;alert('Secret Room Opened')}});

/* CONTROLS */ const controls=new THREE.PointerLockControls(camera,document.body); document.body.onclick=()=>controls.lock(); scene.add(controls.getObject()); const move={f:0,b:0,l:0,r:0}; document.addEventListener('keydown',e=>{if(e.key=='w')move.f=1;if(e.key=='s')move.b=1;if(e.key=='a')move.l=1;if(e.key=='d')move.r=1}); document.addEventListener('keyup',e=>{if(e.key=='w')move.f=0;if(e.key=='s')move.b=0;if(e.key=='a')move.l=0;if(e.key=='d')move.r=0});

/* PIANO */ const piano=new Audio('https://cdn.pixabay.com/download/audio/2021/09/28/audio_c0c1b33e56.mp3'); function playPiano(){piano.paused?piano.play():piano.pause()}

/* RAIN REFLECTION */ const rain=new THREE.Mesh(new THREE.PlaneGeometry(60,30),new THREE.MeshStandardMaterial({color:0x223344,transparent:true,opacity:.2})); rain.position.set(0,10,-15); scene.add(rain);

/* FAKE AVATARS */ for(let i=0;i<4;i++){ let a=new THREE.Mesh(new THREE.BoxGeometry(1,2,1),new THREE.MeshStandardMaterial({color:0x8888ff})); a.position.set(Math.random()*8-4,1,Math.random()*8-4); scene.add(a); }

function animate(){ requestAnimationFrame(animate); const s=.08; if(move.f)controls.moveForward(s); if(move.b)controls.moveForward(-s); if(move.l)controls.moveRight(-s); if(move.r)controls.moveRight(s); renderer.render(scene,camera); } animate(); </script>

</body>
</html>
