<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Kensano Secure Channel</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
  <h1>Secure Channel</h1>
  <p>End-to-end encrypted session active.</p>

  <div class="chat-box" id="chat"></div>

  <input placeholder="Type secure message">
  <button>Send</button>
</div>

<!-- 🔐 SESSION CHECK (STEP 6) -->
<script>
  fetch("/session", {
    headers: {
      "Authorization": localStorage.getItem("kensano_token")
    }
  }).then(res => {
    if (!res.ok) {
      window.location.href = "index.html";
    }
  });
</script>

</body>
</html>
